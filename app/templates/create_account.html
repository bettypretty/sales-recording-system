<!DOCTYPE html>
<html lang ="en">
    <head>
         <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Sales Recording System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-logo">S</div>

        <h1>Create Account</h1>

        <p class="login-subtitle">
            Create your Sales Recording System account
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="error-message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="create-account">

            <span>Already have an account?</span>

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>

</html>
