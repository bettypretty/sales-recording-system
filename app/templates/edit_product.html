
<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Product - Sales Recording System</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
```

</head>

<body>

```
<div class="add-product-container">

    <h1>Edit Product</h1>

    <form
        method="POST"
        class="product-form"
    >

        
        <div class="form-row">

            <label for="name">
                Product Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ product['name'] }}"
                placeholder="Enter product name"
                required
            >

        </div>


        
        <div class="form-row">

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ product['category'] }}"
                placeholder="Enter category"
                required
            >

        </div>


        
        <div class="form-row">

            <label for="price">
                Price
            </label>

            <input
                type="number"
                id="price"
                name="price"
                value="{{ product['price'] }}"
                placeholder="Enter price"
                step="0.01"
                required
            >

        </div>


        
        <div class="form-row">

            <label for="quantity">
                Quantity
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ product['quantity'] }}"
                placeholder="Enter quantity"
                required
            >

        </div>


        
        <div class="form-buttons">

            <button
                type="submit"
                class="save-btn"
            >
                Update Product
            </button>

            <a
                href="/products"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>
```

</body>

</html>
